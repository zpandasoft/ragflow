<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- 标题 -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">通用型ESG合规爬虫Agent架构</text>
  
  <!-- 配置与控制层 -->
  <rect x="50" y="70" width="700" height="80" fill="#e2d9f3" rx="8" ry="8" stroke="#6f42c1" stroke-width="2"/>
  <text x="400" y="95" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">配置与控制层</text>
  
  <!-- 配置控制组件 -->
  <rect x="80" y="110" width="120" height="30" fill="#ffffff" rx="5" ry="5" stroke="#6f42c1" stroke-width="1"/>
  <text x="140" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">任务管理器</text>
  
  <rect x="220" y="110" width="160" height="30" fill="#ffffff" rx="5" ry="5" stroke="#6f42c1" stroke-width="1"/>
  <text x="300" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">国家/产品配置管理</text>
  
  <rect x="400" y="110" width="160" height="30" fill="#ffffff" rx="5" ry="5" stroke="#6f42c1" stroke-width="1"/>
  <text x="480" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">爬取策略与优先级管理</text>
  
  <rect x="580" y="110" width="140" height="30" fill="#ffffff" rx="5" ry="5" stroke="#6f42c1" stroke-width="1"/>
  <text x="650" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">数据源模板管理</text>
  
  <!-- 数据源层 -->
  <rect x="50" y="160" width="700" height="90" fill="#d1e7dd" rx="8" ry="8" stroke="#198754" stroke-width="2"/>
  <text x="400" y="185" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">数据源层</text>
  
  <!-- 数据源图标 -->
  <rect x="80" y="210" width="155" height="30" fill="#ffffff" rx="5" ry="5" stroke="#198754" stroke-width="1"/>
  <text x="157" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">多国政府法规数据源</text>
  
  <rect x="245" y="210" width="155" height="30" fill="#ffffff" rx="5" ry="5" stroke="#198754" stroke-width="1"/>
  <text x="322" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">国际/区域组织数据源</text>
  
  <rect x="410" y="210" width="155" height="30" fill="#ffffff" rx="5" ry="5" stroke="#198754" stroke-width="1"/>
  <text x="487" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">行业标准与认证数据源</text>
  
  <rect x="575" y="210" width="155" height="30" fill="#ffffff" rx="5" ry="5" stroke="#198754" stroke-width="1"/>
  <text x="652" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">NGO与研究机构数据源</text>
  
  <!-- 爬虫引擎层 -->
  <rect x="50" y="260" width="700" height="110" fill="#cfe2ff" rx="8" ry="8" stroke="#0d6efd" stroke-width="2"/>
  <text x="400" y="285" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">爬虫引擎层</text>
  
  <!-- 爬虫组件 -->
  <rect x="80" y="310" width="120" height="30" fill="#ffffff" rx="5" ry="5" stroke="#0d6efd" stroke-width="1"/>
  <text x="140" y="330" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">AI分词器</text>
  
  <rect x="210" y="310" width="120" height="30" fill="#ffffff" rx="5" ry="5" stroke="#0d6efd" stroke-width="1"/>
  <text x="270" y="330" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">AI数据源分析器</text>
  
  <rect x="340" y="310" width="120" height="30" fill="#ffffff" rx="5" ry="5" stroke="#0d6efd" stroke-width="1"/>
  <text x="400" y="330" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">网页下载器</text>
  
  <rect x="470" y="310" width="145" height="30" fill="#ffffff" rx="5" ry="5" stroke="#0d6efd" stroke-width="1"/>
  <text x="542" y="330" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">自适应网站识别器</text>
  
  <rect x="625" y="310" width="105" height="30" fill="#ffffff" rx="5" ry="5" stroke="#0d6efd" stroke-width="1"/>
  <text x="677" y="330" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">数据存储器</text>
  
  <rect x="240" y="350" width="320" height="30" fill="#ffffff" rx="5" ry="5" stroke="#0d6efd" stroke-width="1"/>
  <text x="400" y="370" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">反爬虫策略与多语言内容处理</text>
  
  <!-- 数据处理层 -->
  <rect x="50" y="380" width="700" height="110" fill="#f8d7da" rx="8" ry="8" stroke="#dc3545" stroke-width="2"/>
  <text x="400" y="405" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">数据处理层</text>
  
  <!-- 数据处理组件 -->
  <rect x="80" y="430" width="150" height="30" fill="#ffffff" rx="5" ry="5" stroke="#dc3545" stroke-width="1"/>
  <text x="155" y="450" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">多语言数据清洗</text>
  
  <rect x="240" y="430" width="165" height="30" fill="#ffffff" rx="5" ry="5" stroke="#dc3545" stroke-width="1"/>
  <text x="322" y="450" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">法规/标准语义分析</text>
  
  <rect x="415" y="430" width="160" height="30" fill="#ffffff" rx="5" ry="5" stroke="#dc3545" stroke-width="1"/>
  <text x="495" y="450" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">跨国标准映射比较</text>
  
  <rect x="585" y="430" width="145" height="30" fill="#ffffff" rx="5" ry="5" stroke="#dc3545" stroke-width="1"/>
  <text x="657" y="450" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">ESG要求分类器</text>
  
  <!-- 知识图谱节点 -->
  <rect x="240" y="470" width="320" height="30" fill="#ffffff" rx="5" ry="5" stroke="#dc3545" stroke-width="1"/>
  <text x="400" y="490" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">ESG合规知识图谱构建与维护</text>
  
  <!-- 应用层 -->
  <rect x="50" y="500" width="700" height="90" fill="#fff3cd" rx="8" ry="8" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="525" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">应用与交互层</text>
  
  <!-- 应用组件 -->
  <rect x="80" y="550" width="110" height="30" fill="#ffffff" rx="5" ry="5" stroke="#ffc107" stroke-width="1"/>
  <text x="135" y="570" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">法规更新提醒</text>
  
  <rect x="200" y="550" width="110" height="30" fill="#ffffff" rx="5" ry="5" stroke="#ffc107" stroke-width="1"/>
  <text x="255" y="570" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">合规要求检查</text>
  
  <rect x="320" y="550" width="110" height="30" fill="#ffffff" rx="5" ry="5" stroke="#ffc107" stroke-width="1"/>
  <text x="375" y="570" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">国别差异分析</text>
  
  <rect x="440" y="550" width="110" height="30" fill="#ffffff" rx="5" ry="5" stroke="#ffc107" stroke-width="1"/>
  <text x="495" y="570" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">认证路径推荐</text>
  
  <rect x="560" y="550" width="170" height="30" fill="#ffffff" rx="5" ry="5" stroke="#ffc107" stroke-width="1"/>
  <text x="645" y="570" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">可视化与知识图谱查询</text>
  
  <!-- 连接线 -->
  <line x1="400" y1="150" x2="400" y2="160" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="250" x2="400" y2="260" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="380" x2="400" y2="380" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="490" x2="400" y2="500" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
</svg>